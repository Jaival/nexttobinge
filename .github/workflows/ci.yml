# Runs on every pull request and every push to main. A red check on a PR
# means "don't merge": the same failure would otherwise happen in production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that's still going for the
# old commit. Nobody needs results for code that's already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository. The default token
# could otherwise push commits or edit issues.
permissions:
  contents: read

env:
  # Matches the local toolchain. Bump it here and locally together.
  BUN_VERSION: 1.3.14
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # next.config.ts validates env vars on load. Linting and type checking
      # don't need real values, so this job holds no secrets at all, and it
      # also runs for pull requests from forks.
      SKIP_ENV_VALIDATION: 1
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Downloaded packages, keyed on the lockfile: unchanged dependencies
      # install from the cache instead of the network.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile fails if package.json and bun.lock disagree, instead
      # of quietly installing different versions than you tested with.
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  build:
    name: Build
    needs: checks
    # Pull requests from forks don't get secrets. Without the TMDB key the
    # build would fail for reasons that have nothing to do with the change.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build prerenders the home page, collections and sitemap, which
      # call TMDB. Settings → Secrets and variables → Actions → Secrets.
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # Publishable keys ship to every browser, so it's a variable, not a
      # secret. Use the Clerk development instance's key.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # Never used during the build, only validated. Placeholders mean CI holds
      # no credential that could reach real users' data.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Next.js's incremental build cache. Restoring the closest previous
      # entry makes a rebuild with small changes much faster.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - run: bun install --frozen-lockfile
      - run: bun run build
